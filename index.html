    <title>Black Stone Fitness (BSF) | Mysuru's Premier Strength & Training Hub</title>
    <script>
      (function() {
        var isExhausted = function(args) {
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            var s = '';
            if (typeof a === 'string') s = a;
            else if (a && (a.message || a.stack)) s = (a.message || '') + ' ' + (a.stack || '');
            else if (a && typeof a.toString === 'function') s = a.toString();
            if (
              s.indexOf('RESOURCE_EXHAUSTED') !== -1 ||
              s.indexOf('resource-exhausted') !== -1 ||
              s.indexOf('Quota limit exceeded') !== -1 ||
              s.indexOf('Free daily write units') !== -1 ||
              s.indexOf('free tier database') !== -1 ||
              (s.indexOf('GrpcConnection') !== -1 && s.indexOf('stream') !== -1)
            ) {
              return true;
            }
          }
          return false;
        };
        var origError = console.error;
        console.error = function() {
          if (isExhausted(arguments)) return;
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          if (isExhausted(arguments)) return;
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function(e) {
          if (isExhausted([e.message, e.error])) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isExhausted([e.reason && e.reason.message, e.reason])) {
            e.preventDefault();
            e.stopPropagation();
          }
        }, true);
      })();
    </script>
