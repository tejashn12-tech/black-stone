<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bsfDarkBg" cx="50%" cy="50%" r="50%" fx="40%" fy="35%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#050507"/>
    </radialGradient>

    <!-- Athletic Flame Orange Gradient -->
    <linearGradient id="bsfOrangeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="25%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="bsfGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Faceted Stone Plate Gradient -->
    <linearGradient id="bsfStoneLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <linearGradient id="bsfStoneDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Text Fill Gradient -->
    <linearGradient id="bsfTextOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="bsfDropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <!-- Arched Text Paths -->
    <!-- Top Arc: center at 256,256, radius 195 -->
    <path id="topTextArc" d="M 66 256 A 190 190 0 0 1 446 256" fill="none" />
    <!-- Bottom Arc: center at 256,256, radius 195 -->
    <path id="bottomTextArc" d="M 446 256 A 190 190 0 0 1 66 256" fill="none" />
  </defs>

  <!-- Base Circle & Shadow -->
  <circle cx="256" cy="256" r="248" fill="#050507" />
  
  <!-- Outer Metallic Border -->
  <circle cx="256" cy="256" r="244" fill="url(#bsfDarkBg)" stroke="url(#bsfOrangeRim)" stroke-width="14" />
  
  <!-- Outer Knurled / Rivet Decorative Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="#F97316" stroke-width="2.5" stroke-opacity="0.4" stroke-dasharray="8 6" />

  <!-- Inner Plate Boundary -->
  <circle cx="256" cy="256" r="158" fill="url(#bsfDarkBg)" stroke="url(#bsfOrangeRim)" stroke-width="4.5" />

  <!-- Arched Typography - Top: BLACK STONE -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="900" font-size="34" letter-spacing="9" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
      BLACK STONE
    </textPath>
  </text>

  <!-- Arched Typography - Bottom: FITNESS • MYSURU -->
  <text font-family="'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-weight="800" font-size="28" letter-spacing="7" fill="#FB923C" text-anchor="middle">
    <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
      FITNESS • MYSURU
    </textPath>
  </text>

  <!-- Left Star Accent -->
  <g transform="translate(64, 256)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#bsfGold)" />
  </g>

  <!-- Right Star Accent -->
  <g transform="translate(448, 256)">
    <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="url(#bsfGold)" />
  </g>

  <!-- Central Shield / Faceted Stone Emblem Core -->
  <g id="center-core" filter="url(#bsfDropShadow)">
    
    <!-- Heavy Athletic Barbell Silhouette in Background -->
    <g opacity="0.45">
      <!-- Barbell Bar -->
      <rect x="136" y="250" width="240" height="12" rx="4" fill="#52525b" />
      <rect x="136" y="252" width="240" height="4" rx="2" fill="#a1a1aa" />
      <!-- Outer Weights Left -->
      <rect x="138" y="224" width="12" height="64" rx="3" fill="#3f3f46" stroke="#27272a" stroke-width="1.5"/>
      <rect x="154" y="214" width="14" height="84" rx="4" fill="#27272a" stroke="#F97316" stroke-width="1.5"/>
      <!-- Outer Weights Right -->
      <rect x="344" y="214" width="14" height="84" rx="4" fill="#27272a" stroke="#F97316" stroke-width="1.5"/>
      <rect x="362" y="224" width="12" height="64" rx="3" fill="#3f3f46" stroke="#27272a" stroke-width="1.5"/>
    </g>

    <!-- Faceted Hexagonal Stone Shield -->
    <polygon points="256,128 356,186 356,310 256,368 156,310 156,186"
             fill="url(#bsfStoneDark)"
             stroke="url(#bsfOrangeRim)"
             stroke-width="6"
             stroke-linejoin="round" />

    <!-- Stone Facet Cuts & Highlights -->
    <polygon points="256,128 356,186 256,248" fill="url(#bsfStoneLight)" opacity="0.35" />
    <polygon points="156,186 256,128 256,248" fill="#52525b" opacity="0.2" />
    <polygon points="156,310 156,186 256,248" fill="#18181b" opacity="0.5" />
    <polygon points="356,186 356,310 256,248" fill="url(#bsfStoneLight)" opacity="0.25" />
    <polygon points="156,310 256,368 256,248" fill="#09090b" opacity="0.6" />
    <polygon points="256,368 356,310 256,248" fill="url(#bsfStoneLight)" opacity="0.4" />

    <!-- Inner Shield Inset Border -->
    <polygon points="256,144 342,194 342,300 256,350 170,300 170,194"
             fill="none"
             stroke="#F97316"
             stroke-width="2"
             stroke-opacity="0.5"
             stroke-linejoin="round" />

    <!-- Iconic BSF Bold Lettering -->
    <!-- B -->
    <text x="256" y="274"
          font-family="'Bebas Neue', 'Outfit', 'Plus Jakarta Sans', Impact, sans-serif"
          font-weight="900"
          font-size="94"
          letter-spacing="5"
          text-anchor="middle"
          fill="url(#bsfTextOrange)"
          stroke="#000000"
          stroke-width="4"
          paint-order="stroke fill"
          style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.9));">
      BSF
    </text>

    <!-- Sub-badge Banner: EST. 2026 / STRENGTH -->
    <g transform="translate(256, 308)">
      <rect x="-56" y="-10" width="112" height="20" rx="4" fill="#09090b" stroke="#F97316" stroke-width="1.5" />
      <text x="0" y="4"
            font-family="'Outfit', -apple-system, sans-serif"
            font-weight="800"
            font-size="10.5"
            letter-spacing="3"
            fill="#FDBA74"
            text-anchor="middle">
        STRENGTH
      </text>
    </g>

    <!-- Top Crown / Diamond Peak Accent -->
    <polygon points="256,112 264,124 256,128 248,124" fill="url(#bsfGold)" />
  </g>

  <!-- Inner Rim Glow Accent Arc -->
  <path d="M 120 180 A 160 160 0 0 1 392 180" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.15" stroke-linecap="round" />
</svg>
